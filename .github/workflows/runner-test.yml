name: Runner Test

on:
  workflow_dispatch:
  push:
    branches:
      - runner-test

jobs:
  test-runner:
    runs-on:
      - self-hosted

    steps:
      - name: Who am I
        run: whoami

      - name: Hostname
        run: hostname

      - name: Docker
        run: docker ps

      - name: PDK Version
        run: docker exec puppet-agent pdk --version

      - name: PDK Validate
        continue-on-error: true
        run: docker exec puppet-agent bash -lc "cd /workspace/puppetlabs-apt && pdk validate"

      - name: PDK Unit Tests
        run: docker exec puppet-agent bash -lc "cd /workspace/puppetlabs-apt && pdk test unit"
