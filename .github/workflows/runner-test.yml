name: Runner Test

on:
  workflow_dispatch:
  pull_request:

jobs:
  test-runner:
    runs-on:
      - self-hosted
      - puppet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show workspace
        run: |
          pwd
          echo "$GITHUB_WORKSPACE"
          ls -la

      - name: PDK Version
        run: |
          docker exec \
            --user runner \
            puppet-agent \
            pdk --version

      - name: PDK Validate
        continue-on-error: true
        run: |
          docker exec \
            --user runner \
            puppet-agent \
            bash -lc \
            "cd /runner/actions-runner/_work/puppetlabs-apt/puppetlabs-apt && pdk validate"

      - name: PDK Unit Tests
        run: |
          docker exec \
            --user runner \
            puppet-agent \
            bash -lc \
            "cd /runner/actions-runner/_work/puppetlabs-apt/puppetlabs-apt && pdk test unit"
