---
.rubocop.yml:
  include_todos: true
Rakefile:
  changelog_max_issues: 500
  extra_disabled_lint_checks:
    - anchor_resource
spec/spec_helper.rb:
  mock_with: ":rspec"
  coverage_report: true
.gitpod.Dockerfile:
  unmanaged: false
.gitpod.yml:
  unmanaged: false
.github/workflows/auto_release.yml:
  unmanaged: false
.github/workflows/ci.yml:
  unmanaged: true
  acceptance_flags:
    - '--nightly'
    - '--collection-platform-exclude 9:ubuntu-18.04'
    - '--collection-platform-exclude 9:ubuntu-20.04'
.github/workflows/nightly.yml:
  unmanaged: true
  acceptance_flags:
    - '--nightly'
    - '--collection-platform-exclude 9:ubuntu-18.04'
    - '--collection-platform-exclude 9:ubuntu-20.04'
.github/workflows/release.yml:
  unmanaged: false
